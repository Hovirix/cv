version: '3'

vars:
  TEMPLATE: cv/cv.tex.jinja
  TEXINPUTS: 'tex//:'
  TEX_CWD: tex

tasks:
  build:
    desc: Build all CVs in cv/*.yaml
    cmds:
      - |
        for f in cv/*.yaml; do
          [ -e "$f" ] || continue
          b=$(basename "$f" .yaml)

          python -m lib.cli validate --yaml-path "$f"

          python -m lib.cli render \
            --yaml-path "$f" \
            --template-path "{{.TEMPLATE}}" \
            --out "build/${b}.tex"

          python -m lib.cli compile \
            --tex-path "build/${b}.tex" \
            --out-dir "build/${b}" \
            --texinputs "{{.TEXINPUTS}}" \
            --tex-cwd "{{.TEX_CWD}}"
        done
